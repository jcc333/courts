[package]
name = "pqpeek"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
arrow = { version = "60.2.0", features = ["prettyprint"] }
clap = { version = "4.6.10", features = ["derive"] }
color-eyre = "0.6.5"
parquet = { version = "60.2.0", features = ["arrow"] }
sigpipe = "0.1.3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
